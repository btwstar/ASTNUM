version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Next.js upgrades deserve manual attention (App Router / static export)
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
